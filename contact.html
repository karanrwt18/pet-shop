<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact - PetLover</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="nav"><a class="logo" href="index.html"><span>Pet</span>Lover</a><button class="menu-btn"
            onclick="toggleMenu()">☰</button>
        <nav id="navLinks"><a href="index.html">Home</a><a href="about.html">About</a><a
                href="services.html">Service</a><a href="price.html">Price</a><a href="booking.html">Booking</a><a
                class="active" href="contact.html">Contact</a><a class="quote" href="booking.html">Get Quote</a></nav>
    </header>
    <div class="page-head">
        <h1>Contact Us</h1>
        <p>Home / Contact</p>
    </div>
    <section class="contact-page">
        <div>
            <p class="green">Get In Touch</p>
            <h2>Contact <span>PetLover</span></h2>
            <p>Have a question about our services? Send us a message and our team will get back to you.</p>
            <div class="contact-info">
                <p>📍 123 Street, New York, USA</p>
                <p>📞 +012 345 67890</p>
                <p>✉ info@example.com</p>
            </div>
        </div>
        <form id="contactForm"><input required placeholder="Your Name"><input required type="email"
                placeholder="Your Email"><input placeholder="Subject"><textarea required
                placeholder="Message"></textarea><button class="btn orange">Send Message</button></form>
    </section>
    <script src="script.js"></script>
</body>

</html>
